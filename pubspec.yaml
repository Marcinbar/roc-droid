name: roc_droid
description: "Roc for Android!"
publish_to: 'none'
version: 0.3.0
environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: '>=0.20.2'
  logger: ^2.6.2
  mobx: ^2.6.0
  flutter_mobx: ^2.3.0
  darq: ^2.1.0
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4
  pigeon: ^27.3.0
  event: ^3.1.0
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1
  shared_preferences: ^2.5.4
  json_annotation: ^4.9.0
  freezed_annotation: ^3.1.0
  dartssh2: ^2.13.0
  flutter_volume_controller: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.26.3
  build_runner: ^2.10.5
  mobx_codegen: ^2.7.5
  flutter_oss_licenses: ^3.0.12
  json_serializable: ^6.11.2
  freezed: ^3.2.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/splash.png
    - assets/splash_big.png
    - assets/icon.png

flutter_native_splash:
  android: true
  ios: true
  web: false
  image: assets/splash.png
  android_12:
    image: assets/splash_big.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  web:
    generate: true
    image_path: "assets/icon.png"
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icon.png"
